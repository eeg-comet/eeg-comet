# EEG-COMET Documentation Site Configuration
# Built with Jekyll + Just the Docs theme.
# https://just-the-docs.com/

# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: EEG-COMET
tagline: EEG Comprehensive Microstate Extraction Toolbox
description: >-
  Official documentation for EEG-COMET — an open-source platform for
  comprehensive EEG microstate analysis with automated quality control,
  ML-based labeling, advanced feature extraction, and source localization.
url: "https://eeg-comet.github.io"
baseurl: "/eeg-comet"
version: "1.0.0"
lang: en

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
# `theme:` (not `remote_theme:`) — the just-the-docs gem is already provisioned
# in docs/Gemfile, so we avoid needing the jekyll-remote-theme plugin (which
# is *not* enabled in the plugins list below). Without this, GitHub Pages
# silently fails to load the theme and the site falls back to bare HTML.
theme: just-the-docs
color_scheme: comet
logo: "/assets/images/logo.png"

# ---------------------------------------------------------------------------
# Markdown / Kramdown
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Render LaTeX math (kramdown `$$ ... $$` blocks) site-wide via MathJax.
# See docs/_includes/head_custom.html and docs/_includes/mathjax.html.
math: mathjax

# ---------------------------------------------------------------------------
# Search
# ---------------------------------------------------------------------------
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav_sort: case_insensitive
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# ---------------------------------------------------------------------------
# Footer / external links
# ---------------------------------------------------------------------------
footer_content: >-
  EEG-COMET &copy; 2024&ndash;2026 SFU eBrain Lab. Released under the
  <a href="https://github.com/eeg-comet/eeg-comet/blob/stable/LICENSE">GNU General Public License v3.0</a>.

aux_links:
  "GitHub":
    - "https://github.com/eeg-comet/eeg-comet"
  "Issues":
    - "https://github.com/eeg-comet/eeg-comet/issues"
  "License":
    - "https://github.com/eeg-comet/eeg-comet/blob/stable/LICENSE"
  "Cite":
    - "https://github.com/eeg-comet/eeg-comet/blob/stable/CITATION.cff"
aux_links_new_tab: true

# "Edit this page on GitHub" link rendered at the bottom of every page
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/eeg-comet/eeg-comet"
gh_edit_branch: "stable"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# ---------------------------------------------------------------------------
# UX features
# ---------------------------------------------------------------------------
enable_copy_code_button: true
mermaid:
  version: "10.9.1"

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-sitemap

# SEO defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/logo.png

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .jekyll-cache
  - node_modules
