# EEG-COMET Documentation Site Configuration
title: EEG-COMET
description: EEG Comprehensive Microstate Extraction Toolbox — official documentation
url: "https://eeg-comet.github.io"
baseurl: ""
version: "1.0.0"
remote_theme: just-the-docs/just-the-docs@v0.8.2

# Logo and branding
logo: "/assets/images/logo.png"

# Color scheme (custom)
color_scheme: comet

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_insensitive

# Heading anchor links
heading_anchors: true

# Footer
footer_content: "EEG-COMET &copy; 2024-2026 SFU eBrain Lab. Released under the GNU General Public License v3.0."

# Aux links (top-right of every page)
aux_links:
  "GitHub":
    - "https://github.com/eeg-comet/eeg-comet"
  "License":
    - "https://github.com/eeg-comet/eeg-comet/blob/main/LICENSE"
  "Cite":
    - "https://github.com/eeg-comet/eeg-comet/blob/main/CITATION.cff"
aux_links_new_tab: true

# "Edit this page on GitHub" link rendered at the bottom of every page
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/eeg-comet/eeg-comet"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Code copy button
enable_copy_code_button: true

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

