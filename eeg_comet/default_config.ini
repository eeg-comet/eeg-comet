# Guide for config file

# For [io_config]
# study_name: name of this study, will be used as the name of the output folder
# input_folder: folder contains input EEG data
# channel_location_dir: path to the channel location file
# output_folder: folder that will save the output file
# load_all_files: if True, load every file in input_folder and ignore pattern_content
# pattern_content: only load files with given pattern
# extension: the extension of eeg file, can be '.set', '.fdt', ...
# data_type: datatype of eeg file, can be 'raw' or 'epoched'. 'epoched' requires EEGLAB '.set'

# For [preprocessing_config]
# temporal_filter_data: choose to filter data or not
# filter_method: 'fir' or 'iir'
# lowcut_freq, highcut_freq: bound for frequency cut. highcut_freq must stay below
#       half of the smaller of the input and target sampling rates, or loading fails.
# downsample_data: choose to downsample data or not
# sampling_rate: rate for downsample data
# remove_channels: remove channels or not, if False, remove missing channels
# channels_to_remove: name of channels to be remove, seperated by comma

# For [clustering_config]
# smoothing_gfp: restrict GFP peak detection to peaks at least smoothing_distance apart
# smoothing_distance: minimum spacing between GFP peaks in MILLISECONDS; only used when smoothing_gfp is True
# n_maps: could be auto, or a integer number, which means the number of microstate classes
# k_min, k_max: if n_maps is auto, the toolbox will find the best number of microstate classes between k_min and k_max
# stopping_mode: can be 'majority_vote', 'gev', 'cv', 'db', 'kl', 'sil', 'dunn', 'ch', 'gap', 'aic' or 'bic'; The toolbox will choose k based on it
# stopping_threshold: only used by 'gev' mode; the minimum relative GEV gain (percent) that justifies an additional cluster (integer between 1 and 100, default is 10). Ignored by every other stopping_mode.
# data_percentage: should be an integer, default is 100, which indicates 100%; It's the percentage of data which will be used
# Note: For auto-k selection, GFP peaks are always used regardless of this setting 
# initializer: can be 'Random' or 'K-Means++'
# clustering_method: can be 'Modified K-Means Clustering', 'Modified K-Means Clustering with Spatial Similarity' or 'Topographic Atomize and Agglomerate Hierarchical Clustering'
# similarity_metric: only used by the Spatial Similarity method; 'Spatial Correlation' or 'Cosine Similarity'
# max_iterations: max number of iterations for the algorithm
# clustering_tolerance: when difference is lower than clustering_tolerance, we think it's good enough
# n_repeats: integer, repeat the clustering for several times

# For [backfitting_config]
# backfit_to: can be 'all' or 'peaks', means do backfitting to all states or just peak states
# identify_short_window = whether to identify the window length that is considered unreliable
# filter_segments: do segments filtering or not
# filter_segments_option: filter method, can be 'replace_half' or 'remove' or 'replace_high' or 'smooth'
# filter_segments_less_than: integer (milliseconds), filter segments less than specific length
# convergence_epsilon, half_window_size, smoothness_penalty: parameter for 'smooth' algorithm above.
# 		convergence_epsilon: convergence criterion parameter
#       half_window_size: half-window b (in samples) of the smoothing window, per Pascual-Marqui et al. (1995). Independent of filter_segments_less_than.
#       smoothness_penalty: non-smoothness penalty parameter (lambda)
# min_correlation_threshold: reject timepoints with |correlation| below this (e.g. 0.5); use False or 0 to disable
# correlation_rejection_mode: what happens to those timepoints.
#       'reject'  = they stay unassigned, so the threshold is hard quality control. Default.
#       'flag'    = they are marked ambiguous and relabelled by the length-preserving
#                   segment filters, giving a gap-free sequence. Required for event-related
#                   analyses (ROF, RTF, windowed features) that need continuous labelling.

# For [features_config]
# export_format: can be '.csv', '.pkl', '.hdf' or '.json'
# feature_list: choose from COV, OCC, DUR, TP, GEV, LZC, ER, ERR, HE
#       MMD is accepted as an alias for DUR (mean microstate duration).
# feature_mode: 'averaged', 'sliding' or 'pre_post'
# feature_types: 'real', 'surrogate' and/or 'random'
# sliding_window_size: length of feature window, in seconds
# duration_method: how per-segment durations are summarised for the DUR feature.
#       'geometric'  = geometric mean of run lengths * (1000/fs). Default;
#                       robust to long-tail outliers that otherwise inflate
#                       the mean for high-coverage microstates.
#       'arithmetic' = mean of run lengths, then (N-1)/fs. Algebraically
#                       consistent with COV and OCC: DUR == COV*10/OCC - 1000/fs.
#       'median' / 'trimmed_mean' = robust alternatives that also reduce the
#                       inflation seen on dominant microstates.

# For [source_config]
# use_anatomy: 'fsaverage' for the template head model, or 'individual' for per-subject MRIs
# bem_solver: boundary element solver, 'mne' or 'openmeeg'
# inverse_method: 'MNE', 'wMNE', 'dSPM', 'sLORETA', 'eLORETA', 'LORETA', 'LAURA' or 'FISTA'
# n_permutations: number of permutations used to build the TESS null distribution
# spacing: source-space resolution, one of 'ico3', 'ico4' or 'ico5'
# source_localization_method: can be 'avg' or 'tess'
# anatomy_subjects_dir: FreeSurfer subjects directory; only used when use_anatomy = individual


[io_config]
# study_name: name of this study (will be used as the output sub-folder name)
# input_folder: folder containing input EEG data (leave blank to set via the GUI/CLI)
# channel_location_dir: optional path to a channel-location CSV
# output_folder: folder where COMET writes per-stage artifacts
study_name =
input_folder =
channel_location_dir =
extension = .auto
pattern_content = *
load_all_files = True
data_type = raw
output_folder =

[preprocessing_config]
temporal_filter_data = True
filter_method = fir 
lowcut_freq = 2 
highcut_freq = 20 
downsample_data = True
sampling_rate = 250
remove_channels = False
channels_to_remove =

[clustering_config]
smoothing_gfp = False
smoothing_distance = 10
n_maps = 4
k_min = 2
k_max = 10
stopping_mode = majority_vote
stopping_threshold = 10
data_percentage = 100
# Note: When n_maps = auto, GFP peaks are always used and n_repeats = 1
initializer = Random
clustering_method = Modified K-Means Clustering
similarity_metric = Spatial Correlation
max_iterations = 500
clustering_tolerance = 1e-6
n_repeats = 5

[backfitting_config]
backfit_to = all
identify_short_window = False
filter_segments = False
filter_segments_less_than = 20
filter_segments_option = smooth
convergence_epsilon = 1e-6
half_window_size = 3
smoothness_penalty = 5
min_correlation_threshold = False
correlation_rejection_mode = reject

[features_config]
export_format = .csv
feature_list = OCC, DUR, COV
feature_mode = averaged
feature_types = real
sliding_window_size = 1
duration_method = geometric

[source_config]
use_anatomy = fsaverage
bem_solver = mne
inverse_method = dSPM
n_permutations = 2000
spacing = ico3
source_localization_method = tess
anatomy_subjects_dir =
