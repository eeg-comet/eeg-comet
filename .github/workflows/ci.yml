name: CI

# EEG-COMET 1.0.0 CI: deliberately lightweight.
#
# * Lint runs ruff in "bug-catcher" mode only (see [tool.ruff.lint] in
#   pyproject.toml). It will not fail on stylistic issues.
# * Tests are smoke tests only — they import eeg_comet and verify the
#   advertised version. They intentionally avoid the heavy GUI / scientific
#   stack (PyQt5, pyvista, vtk, mne, ...) which is hard to install on bare
#   GitHub runners without xvfb / system Qt libraries. A real cross-platform
#   matrix can be reintroduced once those are wired up and there are
#   meaningful tests to run.

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff (lint, bug-catcher rules only)
        # We pass --select on the CLI rather than relying solely on
        # pyproject.toml because ruff treats eeg_comet/ as a nested project
        # root (it contains __init__.py) and that interaction can cause the
        # repo-level [tool.ruff.lint] select list to be ignored. The CLI
        # value below is the source of truth; pyproject.toml mirrors it for
        # local development.
        run: |
          ruff check \
            --select E9,F63,F7,F82 \
            --no-cache \
            eeg_comet tests

  smoke-test:
    name: Smoke test (ubuntu / py3.11)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run smoke tests
        # Restrict to tests/test_smoke.py specifically so this job stays
        # green even if tests requiring the full scientific stack
        # (numpy/mne/PyQt5/...) get added under tests/ later. Such tests
        # belong in a separate matrix job that installs the project's
        # dependencies — see the comment at the top of this workflow.
        run: pytest -v tests/test_smoke.py
