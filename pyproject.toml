[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-comet"
version = "1.0.0"
description = "EEG-COMET: Comprehensive Microstate Extraction Toolbox for EEG Analysis and Feature Extraction"
readme = "README.md"
authors = [
    {name = "Amin Kabir", email = "aminkabir92@gmail.com"},
    {name = "Raaj Chatterjee", email = "raajc97@gmail.com"},
    {name = "Faranak Farzan", email = "faranak_farzan@sfu.ca"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GPL-3.0 license",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
requires-python = ">=3.8"
dependencies = [
    "mne>=1.0.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "pyqt5>=5.15.0",
    "matplotlib>=3.4.0",
    "opencv-python>=4.5.0",
    "onnxruntime>=1.9.0",
    "pyvista>=0.34.0",
    "scikit-learn>=1.0.0",
    "h5py>=3.1.0",
    "tqdm>=4.60.0"
]

[project.urls]
"Homepage" = "https://www.ebrainlab.ca"
"Source" = "https://github.com/eBrainLab/EEG-COMET"
"Bug Tracker" = "https://github.com/eBrainLab/EEG-COMET/issues"

[project.scripts]
eeg-comet = "eeg_comet.main:run_application"
eeg-comet-terminal = "eeg_comet.terminal_version:main"

[tool.setuptools]
packages = ["eeg_comet"]
include-package-data = true

[tool.setuptools.package-data]
eeg_comet = ["models/*.onnx", "ui/*.png"]