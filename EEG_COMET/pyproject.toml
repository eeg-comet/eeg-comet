[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
extend-exclude = "models|build|dist"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["comet", "controllers", "gui_utils", "data_utils", "clustering_utils", "backfitting_utils", "features_utils", "sourcelocalization_utils"]
skip = ["models"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RET", "F", "D"]
ignore = [
  # Allow some docstring flexibility while using Google style
  "D205", # 1 blank line required between summary line and description
  "D400", # First line should end with a period
  "D401", # First line should be in imperative mood
]
exclude = ["models", "build", "dist"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

