# Guide for config file

# FOR [base]
# study_name: name of this study, will be used as the name of the output folder
# input_folder: folder contains input EEG data
# channel_location_dir: path to the channel location file
# output_folder: folder that will save the output file

# For [load_new_study]
# load_all_files: if True, load all the files in input_folder
# pattern_content: only load files with given pattern
# extension: the extension of eeg file, can be '.set', '.fdt', ...
# datatype: datatype of eeg file, can be 'raw' or 'epoched'
# filter_data: choose to filter data or not
# filter_method: 'fir' or 'iir'
# lowcut_freq, highcut_freq: bound for frequency cut
# downsample_data: choose to downsample data or not
# sample_rate: rate for downsample data
# remove_channels: remove channels or not, if False, remove missing channels
# ch2rm: name of channels to be remove, seperated by comma

# For [do_clustering]
# smoothing_gfp: do smoothing or not
# smoothing_distance: integer, only useful when smoothing_gfp is True
# number_of_maps: could be auto, or a integer number, which means the number of microstate classes
# kmin, kmax: if number_of_maps is auto, the toolbox will find the best number of microstate classes between kmin and kmax
# stopping_mode: can be 'majority_vote', 'gev', 'residual', 'sil', 'ch', 'db', or 'cv'; The toolbox will choose k based on it
# stopping_parameter: not used for majority_vote mode; for other modes, stop and choose the current k value if the change is less than stopping_parameter (integer between 1 and 100, default is 10)
# use_percentages: should be an integer, default is 50, which indicates 50%; It's the percentage of data which will be used
# Note: For auto-k selection, GFP peaks are always used regardless of this setting 
# initializer: can be 'Random' or 'K-Means++'
# clustering_method: can be 'Modified K-Means Clustering', 'K-Means Clustering', 'PCA + K-Means Clustering', 'Autoencoder + K-Means Clustering', 'X-Means Clustering' or 'Agglomerative Hierarchical Clustering'
# max_iterations: max number of iterations for the algorithm
# clustering_tolerance: when difference is lower than clustering_tolerance, we think it's good enough
# clustering_option
# number_of_repeats: integer, repeat the clustering for several times

# For [do_backfitting]
# backfit_to: can be 'all' or 'peaks', means do backfitting to all states or just peak states
# identify_short_window = whether to identify the window length that is considered unreliable
# filter_segments: do segments filtering or not
# filter_segments_option: filter method, can be 'replace_half' or 'remove' or 'replace_high' or 'smooth'
# filter_segments_less_than: integer (milliseconds), filter segments less than specific length
# epsilon, b, lamb: parameter for 'smooth' algorithm above.
# 		epsilon: convergence criterion parameter
#       b: window size parameter (in samples, computed from filter_segments_less_than for smoothing)
#       lamb: non-smoothness penalty parameter (lambda)
# min_correlation_threshold: reject timepoints with |correlation| below this (e.g. 0.5); use False or 0 to disable

# For [extract_features]
# export_format: can be '.csv', '.pkl', '.hdf' or '.json'
# feature_list: choose from COV,OCC,MMD,TP,LZC,GEV
# window_size: length of feature window

# For [source_localize_microstates]
# inverse_method: can be 'dSPM', 'MNE', 'sLORETA' 'eLORETA'
# nperm: number of permutations for the TESS method
# spacing:
# source_localization_method: can be 'avg' or 'tess'


[io_config]
study_name = yyy
input_folder = /Users/bottlecap/Downloads/OneDrive_1_2023-05-25
channel_location_dir = /Users/bottlecap/Downloads/OneDrive_1_2023-05-25/mbb_channel_location.csv
extension = .auto
pattern_content = *
datatype = raw
output_folder = /Users/bottlecap/Downloads/output

[preprocessing_config]
load_all_files = True
datatype = raw
filter_data = True
filter_method = fir 
lowcut_freq = 2 
highcut_freq = 20 
downsample_data = True
sample_rate = 250
remove_channels = False
chan2rm = []

[clustering_config]
smoothing_gfp = True
smoothing_distance = 10 
number_of_maps = 4
kmin = 2
kmax = 10
stopping_mode = majority_vote
stopping_parameter = 10
use_percentages = 50
# Note: When number_of_maps = auto, GFP peaks are always used and n_inits = 1
initializer = Random 
clustering_method = Modified K-Means Clustering
max_iterations = 500
clustering_tolerance = 1e-6 
clustering_option = None
number_of_repeats = 5

[backfitting_config]
backfit_to = all
identify_short_window = False
filter_segments = True
filter_segments_less_than = 20 
filter_segments_option = smooth 
epsilon = 1e-6
b = 3
lamb = 5
min_correlation_threshold = 0.5

[features_config]
export_format = .csv 
feature_list = COV,OCC,MMD
feature_mode = static
feature_types = real,surrogate,random
window_size = 1

[source_config]
inverse_method = dSPM
nperm = 2000
spacing = ico3
source_localization_method = tess
anatomy_subjects_dir = []

